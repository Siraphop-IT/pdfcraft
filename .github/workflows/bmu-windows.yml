name: BMU PDF for Windows

# Builds the BMU PDF installer (.msi) and portable .zip on a Windows runner, unsigned, and
# uploads them as a workflow artifact. It runs on every push to bmu/rebrand; once this file is on
# the default branch it can also be run by hand: Actions > BMU PDF for Windows > Run workflow.
# Self-contained: it does not use storytold/craft-common-actions.

on:
  push:
    branches: [bmu/rebrand]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The craft-fonts build input, pinned as upstream's release build pins it: Noto Sans Thai is
      # the bundled Thai face for Add text and for editing Thai text whose own font is incomplete.
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - name: Configure craft-fonts
        shell: pwsh
        run: |
          "CRAFT_FONTS_DIR=$env:GITHUB_WORKSPACE\craft-fonts" >> $env:GITHUB_ENV
          "CRAFT_FONTS_REQUIRED=1" >> $env:GITHUB_ENV
      - name: Rust toolchain
        run: rustup show
      - name: WiX v5
        run: dotnet tool install --global wix --version 5.0.2
      # Windows' own recogniser reads Thai; add its Thai recognition (the runner has English
      # only) and run the Windows OCR tests before packaging.
      - name: Thai text recognition
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~th-TH~0.0.1.0" | Out-String
          # Angsana New, Cordia New… (kept in .ttc collections), for the installed-font tests.
          Add-WindowsCapability -Online -Name "Language.Fonts.Thai~~~und-THAI~0.0.1.0" | Out-String
          Get-ChildItem "$env:WINDIR\Fonts" -Include angsa*,cordia*,tahoma* -Recurse | Select-Object -ExpandProperty Name
      # bash -e: a failing command fails the step (pwsh only checks the last one).
      - name: Windows OCR and Thai font tests
        shell: bash
        run: |
          set -e
          cargo clippy -p pdfcraft-ocr --all-targets -- -D warnings
          cargo test -p pdfcraft-ocr
          cargo test -p pdfcraft-engine --test windows_ocr --test it --test windows_fonts --test thai_edit_fallback --test thai_comments --test added_text_fonts -- --nocapture
      - name: Build and package
        shell: pwsh
        env:
          PDFCRAFT_REQUIRE_WINRES: "1"
        # The log is only readable with admin rights; on failure its tail also goes into an
        # annotation, which anyone who can see the run can read.
        run: |
          pwsh packaging/windows/package.ps1 -Arch x64 *>&1 | Tee-Object -FilePath package.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content package.log -Tail 30 | ForEach-Object { $_ -replace '%', '%25' -replace '\r', '' }) -join '%0A'
            Write-Output "::error title=package.ps1 failed::$tail"
            exit $code
          }
      - uses: actions/upload-artifact@v4
        with:
          name: bmu-pdf-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error
